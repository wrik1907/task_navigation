# Agent configuration
agent_config:

# Agent identity
  name: AGENT_5_KOOPMAN_L01_FINAL
  robot: jackal

# Action space (derived from robot description)
  action_space:
    type: differential_drive
    linear_range:
    - -0.5
    - 0.5
    angular_range:
    - -1.5
    - 1.5
  normalized_actions: false
  action_chunk: 1
  mirror: none

# Observation pipeline bounds and environment/reward constants.
# # Review and adjust before training - especially laser_num_beams,
# # laser_max_range, goal_radius, max_steps, and velocity bounds.
  parameters:
    laser_num_beams: 640
    laser_angle_min: -3.14159
    laser_angle_increment: 0.009817477
    laser_max_range: 12.0
    min_linear_vel: -0.5
    max_linear_vel: 0.5
    min_translational_vel: -0.5
    max_translational_vel: 0.5
    min_angular_vel: -1.5
    max_angular_vel: 1.5
    ped_num_types: 5
    ped_min_speed_x: 0.0
    ped_max_speed_x: 2.0
    ped_min_speed_y: 0.0
    ped_max_speed_y: 2.0
    ped_social_state_num: 6
    goal_max_dist: 10.0
    subgoal_max_dist: 10.0
    normalize: true
    normalizer: max_abs
    robot_radius: 0.267
    safety_distance: 1.0
    goal_radius: 0.5
    max_steps: 600

# RL framework configuration
  framework:
    name: stable_baselines3
    algorithm:
      type: PPO
      architecture_name: AGENT_5_KOOPMAN
      checkpoint: last_model
      parameters:
        total_timesteps: 100000
        learning_rate:
          type: linear
          kwargs:
            initial_value: 0.001
            final_value: 0.0001
        batch_size: 64
        gamma: 0.99
        stats_window_size: 100
        verbose: 2
        seed: 42
        device: cuda
        show_progress_bar: false
        total_batch_size: 512
        n_epochs: 5
        gae_lambda: 0.95
        normalize_advantage: true
        ent_coef: 0.0
        vf_coef: 0.22
        max_grad_norm: 0.5
        use_sde: false
        sde_sample_freq: -1
        clip_range: 0.2
        target_kl: 1.0
        aux_loss_coef: 0.01
      callbacks:
        periodic_evaluation:
          n_eval_episodes: 40
          eval_freq: 20000
          max_num_moves_per_eps: 250
        stop_training_on_threshold:
          threshold_type: succ
          threshold: 0.9
          verbose: 1

# Reward function
  reward:
    reward_function_dict:
      goal_reached:
        reward: 20
        _follow_subgoal: false
      safe_distance:
        reward: -0.1
      factored_safe_distance:
        factor: -0.2
      approach_goal:
        pos_factor: 0.3
        neg_factor: 0.4
        _goal_update_threshold: 0.25
        _follow_subgoal: true
        _on_safe_dist_violation: true
      collision:
        reward: -15
    verbose: 1
agents_dir:

# Arena / simulation configuration
arena_cfg:
  general:
    debug_mode: false
    no_gpu: false
    n_envs: 2
    max_num_moves_per_eps: 600
    goal_radius: 0.5
    safety_distance: 1.0
    verbose: false
    control_hz: 10.0
    lockstep: false
    lockstep_step_seconds: 0.0999
    env_seed: 42
    env_launch_args: []
  logging:
    default_level: INFO
    overrides:
      rosnav_rl.observations: WARNING
      rosnav_rl.reward: WARNING
      rosnav_rl.spaces: WARNING
    ros_level: WARNING
    ros_overrides: {}
  monitoring:
    wandb:
      enabled: false
      project_name: Arena-RL
      run_name:
      group:
      tags:
    training_metrics: true
    episode_logging:
      last_n_episodes: 25
      record_actions: true
    eval_metrics: false
  task:
    tm_robots: random
    tm_obstacles: random
    tm_modules: staged
    staged:
      starting_stage: 1
      curriculum_definition:
      - task_random_static_n:
        - 0
        - 0
        task_random_interactive_n:
        - 0
        - 0
        task_random_dynamic_n:
        - 0
        - 0
        task_random_static_models: []
        task_random_interactive_models: []
        task_random_dynamic_models: []
        task_episode_goto_pose_tolerance_radius: 1.5
      - task_random_static_n:
        - 2
        - 4
        task_random_interactive_n:
        - 0
        - 0
        task_random_dynamic_n:
        - 0
        - 0
        task_random_static_models:
        - Hospital/SM_Chair_01a
        - Hospital/SM_BedSideTable_01b
        task_random_interactive_models: []
        task_random_dynamic_models: []
        task_episode_goto_pose_tolerance_radius: 1.2
      - task_random_static_n:
        - 3
        - 5
        task_random_interactive_n:
        - 0
        - 0
        task_random_dynamic_n:
        - 0
        - 0
        task_random_static_models:
        - Hospital/SM_Chair_01a
        - Hospital/SM_BedSideTable_01b
        - Hospital/SM_TrashCan
        task_random_interactive_models: []
        task_random_dynamic_models: []
        task_episode_goto_pose_tolerance_radius: 1.0
      - task_random_static_n:
        - 3
        - 5
        task_random_interactive_n:
        - 0
        - 0
        task_random_dynamic_n:
        - 1
        - 3
        task_random_static_models:
        - Hospital/SM_Chair_01a
        - Hospital/SM_BedSideTable_01b
        - Hospital/SM_TrashCan
        - Hospital/IV_Stand
        task_random_interactive_models: []
        task_random_dynamic_models:
        - Common/Human/arenian
        task_episode_goto_pose_tolerance_radius: 0.8
      threshold_type: succ
      upper_threshold: 0.9
      lower_threshold: 0.3
      stage_ticks:
      parameter_node_template: /arena/env_{i}/task_generator_node
      timeout: 5.0
  profiling:
  robot:
    robot_model: jackal
    parts: {}
    frames: {}
  callbacks:
    periodic_evaluation:
      n_eval_episodes: 20
      eval_freq: 100000
      max_num_moves_per_eps: 1200
    checkpoint:
    stop_training_on_threshold:
    checkpoint_ticks: []

# Training metadata
resume: false
